# use in toggling between two latest window.
bind-key a last-window

set -g prefix c-s
unbind c-b
bind-key c-s send-prefix

set -g allow-passthrough all

# Use 1 based index
set -g base-index 1

bind r source-file ~/.config/tmux/tmux.conf

bind e display-popup -d '#{pane_current_path}' -x C -h 70% -w 80% -E 'tmux new-session yazi \; set status off'

set -g @plugin 'tmux-plugins/tpm'

## Tmux with Fzf
TMUX_FZF_LAUNCH_KEY="C-t"

bind-key f new-window ~/.local/bin/tmux-sessionizer
bind-key s new-window ~/.local/bin/tmux-session-list

## Themes
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

set -g @catppuccin_status_background "#191724" 

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# set -g @catppuccin_window_status_style "basic"
# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_middle_separator ""
# set -g @catppuccin_window_right_separator ""

set -g @catppuccin_status_left_separator "█"

run '~/.tmux/plugins/tpm/tpm'
