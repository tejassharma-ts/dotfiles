font_family family="Comic Mono"
font_size 13.5

allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

enable_audio_bell no

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 2
cursor_trail_color #d8a657

shell_integration no-cursor

# Switch tabs directly with Ctrl+S+number
map ctrl+s>1 goto_tab 1
map ctrl+s>2 goto_tab 2
map ctrl+s>3 goto_tab 3
map ctrl+s>4 goto_tab 4
map ctrl+s>5 goto_tab 5
map ctrl+s>6 goto_tab 6
map ctrl+s>7 goto_tab 7
map ctrl+s>8 goto_tab 8
map ctrl+s>9 goto_tab 9

# Create new tab in current working directory
map ctrl+s>c new_tab_with_cwd

map ctrl+s>f launch --type=tab --title=project-launcher project-launcher
map ctrl+s>e launch --type=tab --title=select-wallpaper wall-selector

map ctrl+shift+enter new_window_with_cwd

tab_title_template "{tab.active_exe}"

include current-theme.conf

# Pane borders
active_border_color #d8a657
inactive_border_color #45403d

# ---- Splits (panes) ----
enabled_layouts splits,stack

# Create splits (inherit cwd)
map ctrl+s>- launch --location=hsplit --cwd=current
map ctrl+s>\ launch --location=vsplit --cwd=current
map ctrl+s>x close_window
map ctrl+s>z toggle_layout stack

# Move between splits with ctrl+h/j/k/l
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# ...but let nvim handle them when it's focused (nvim sets IS_NVIM user var
# and hands off to kitty itself when it's at the edge of its own splits)
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# Resize splits
map ctrl+s>h resize_window narrower 3
map ctrl+s>l resize_window wider 3
map ctrl+s>k resize_window taller 3
map ctrl+s>j resize_window shorter 3
